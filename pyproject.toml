[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guardian"
version = "1.0.0"
description = "AI-powered project analysis, bug detection, UI inspection, and assisted fixing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "openai>=1.30.0",
    "rich>=13.0.0",
]

[project.scripts]
guardian = "guardian.cli.app:main"

[tool.setuptools.packages.find]
include = ["guardian*"]
